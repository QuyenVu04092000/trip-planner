name: Daily Push Notification

on:
  schedule:
    # Chạy lúc 0h đêm giờ Việt Nam (UTC+7 = 17:00 UTC ngày hôm trước)
    - cron: '0 17 * * *'
  workflow_dispatch: # cho phép chạy thủ công để test

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase Edge Function
        run: |
          curl -X GET \
            "${{ secrets.SUPABASE_URL }}/functions/v1/trip-push-notify" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
